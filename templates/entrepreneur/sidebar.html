<aside class="sidebar">
  <div>
    <div class="sidebar-section">
      <div class="sidebar-title">Workspace</div>
      <ul class="sidebar-menu">
        <li>
          <a href="{% url 'entrepreneur:dashboard' %}" class="sidebar-link {% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
            Dashboard
          </a>
        </li>
        <li>
          <a href="{% url 'entrepreneur:problem_create' %}" class="sidebar-link {% if request.resolver_match.url_name == 'problem_create' %}active{% endif %}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="16"></line><line x1="8" y1="12" x2="16" y2="12"></line></svg>
            Describe Problem
          </a>
        </li>
        <li>
          <a href="{% url 'entrepreneur:problem_list' %}" class="sidebar-link {% if request.resolver_match.url_name == 'problem_list' or request.resolver_match.url_name == 'problem_matches' %}active{% endif %}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>
            My Problems
          </a>
        </li>
      </ul>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-title">Network & Exchange</div>
      <ul class="sidebar-menu">
        <li>
          <a href="{% url 'community:feed' %}" class="sidebar-link {% if 'community' in request.resolver_match.app_name %}active{% endif %}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
            Community
          </a>
        </li>
        <li>
          <a href="{% url 'collaboration:board' %}" class="sidebar-link {% if 'collaboration' in request.resolver_match.app_name %}active{% endif %}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
            Collaborate
          </a>
        </li>
        <li>
          <a href="{% url 'stories:story_list' %}" class="sidebar-link {% if 'stories' in request.resolver_match.app_name %}active{% endif %}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path></svg>
            Field Stories
          </a>
        </li>
        <li>
          <a href="{% url 'messaging:inbox' %}" class="sidebar-link {% if 'messaging' in request.resolver_match.app_name %}active{% endif %}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
            Messages
          </a>
        </li>
        <li>
          <a href="{% url 'entrepreneur:saved_items' %}" class="sidebar-link {% if request.resolver_match.url_name == 'saved_items' %}active{% endif %}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>
            Saved Bookmarks
          </a>
        </li>
      </ul>
    </div>
  </div>

  <!-- Bottom Profile -->
  <div class="sidebar-user-card">
    <img src="{{ user.avatar_url|default:'https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=200&q=80' }}" class="sidebar-avatar" alt="Profile">
    <div class="sidebar-user-info">
      <span class="sidebar-user-name">{{ user.get_full_name|default:user.username }}</span>
      <a href="{% url 'entrepreneur:profile' %}" class="sidebar-user-role">Edit Profile &rarr;</a>
    </div>
  </div>
</aside>

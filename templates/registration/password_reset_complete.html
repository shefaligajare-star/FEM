{% extends "base.html" %}
{% load static %}

{% block title %}Password Reset Complete — FEM{% endblock %}

{% block layout %}
<div class="container container-narrow" style="padding: 4rem 1.5rem;">
  <div class="card text-center" style="padding: 3rem 2rem; max-width: 500px; margin: 0 auto;">
    <div style="font-size: 3rem; margin-bottom: 1rem;">✅</div>
    <h1 style="font-size: 2rem; font-weight: 800; color: var(--secondary); margin-bottom: 0.75rem;">
      Password Successfully Changed
    </h1>
    <p style="color: var(--text-secondary); line-height: 1.6; margin-bottom: 1.5rem;">
      Your password has been securely updated. You can now sign in using your new credentials.
    </p>
    <a href="{% url 'login' %}" class="btn btn-primary btn-lg">Sign In to FEM</a>
  </div>
</div>
{% endblock %}
